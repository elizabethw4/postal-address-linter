[project]
name = "addrlint"
version = "0.1.0"
description = "Check plain-text address files for structural and postal-format errors."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "elizabethw4" }]

[project.scripts]
addrlint = "addrlint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["addrlint*"]
